# Isolated, disposable test database for the content experiment engine.
#
# Postgres + PostgREST (the API layer Supabase runs) + a gateway that serves
# it at Supabase's /rest/v1 path, so the application's own Supabase client
# talks to it unchanged. Bound to 127.0.0.1 only. Synthetic data only: never
# point this at, or copy from, a real project.
#
#   docker compose -f scripts/experiment-demo/docker-compose.yml up -d
#   npm run demo:experiments
#   docker compose -f scripts/experiment-demo/docker-compose.yml down -v

name: wop-experiment-demo

services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_PASSWORD: demo-only-postgres
    volumes:
      - ./roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
      - ../../supabase/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

  rest:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:demo-only-authenticator@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      # Demo-only signing secret; the demo script signs its keys with it.
      PGRST_JWT_SECRET: demo-only-jwt-secret-not-for-any-real-project-0001
      # Supabase's default response cap, so paging is exercised for real.
      PGRST_DB_MAX_ROWS: "1000"

  gateway:
    image: nginx:1.27.2-alpine
    depends_on: [rest]
    ports:
      - "127.0.0.1:54399:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
